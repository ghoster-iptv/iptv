<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Погода в Екатеринбурге">
    <title>Погода в Екатеринбурге</title>

    <style>
        :root {
            --bg: #eef5ff;
            --card: rgba(255, 255, 255, 0.78);
            --text: #172033;
            --muted: #6f7d91;
            --primary: #3578f6;
            --border: rgba(255, 255, 255, 0.8);
            --shadow: 0 15px 40px rgba(45, 80, 130, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, #cde3ff, transparent 35%),
                linear-gradient(135deg, #f3f8ff, #dcecff);
        }

        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
        }

        header {
            padding: 28px 0 18px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

        .date {
            color: var(--muted);
            font-size: 14px;
        }

        main {
            padding: 25px 0 50px;
        }

        .weather-card,
        .forecast-card,
        .info-card {
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            border-radius: 26px;
        }

        .weather-card {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 30px;
            padding: 35px;
            margin-bottom: 25px;
        }

        .location {
            color: var(--muted);
            font-size: 17px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: clamp(32px, 5vw, 55px);
            margin-bottom: 12px;
        }

        .current-description {
            color: var(--muted);
            font-size: 20px;
            margin-bottom: 25px;
        }

        .temperature {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .temperature-icon {
            font-size: 80px;
        }

        .temperature-value {
            font-size: clamp(65px, 10vw, 105px);
            font-weight: 800;
            line-height: 1;
        }

        .temperature-value sup {
            font-size: 35px;
            vertical-align: top;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            align-content: center;
        }

        .detail {
            padding: 18px;
            background: rgba(255,255,255,.62);
            border-radius: 18px;
        }

        .detail-label {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 7px;
        }

        .detail-value {
            font-size: 20px;
            font-weight: 700;
        }

        .section-title {
            font-size: 25px;
            margin: 30px 0 16px;
        }
