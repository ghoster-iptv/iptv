<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактируемая бегущая строка</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(900px, 95%);
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        textarea,
        select,
        input,
        button {
            font: inherit;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        select,
        input[type="range"] {
            width: 100%;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .preview-title {
            margin-top: 30px;
            font-weight: bold;
        }

        .ticker-window {
            margin-top: 10px;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: #111827;
            color: white;
            padding: 18px 0;
            white-space: nowrap;
        }

        .ticker {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-animation 12s linear infinite;
            animation-direction: normal;
        }

        .ticker.paused {
            animation-play-state: paused;
        }

        @keyframes ticker-animation {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100%);
            }
        }

        .value {
            color: #2563eb;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Редактируемая бегущая строка</h1>

    <label for="textInput">Текст строки:</label>
    <textarea id="textInput">Добро пожаловать на наш сайт! Здесь можно разместить любую информацию.</textarea>

    <div class="controls">
        <div class="control">
            <label for="speedInput">
                Скорость:
                <span id="speedValue" class="value">12</span> секунд
            </label>

            <input
                type="range"
                id="speedInput"
                min="3"
                max="30"
                value="12"
            >
        </div>

        <div class="control">
            <label for="directionInput">Направление:</label>

            <select id="directionInput">
                <option value="normal">Справа налево</option>
                <option value="reverse">Слева направо</option>
            </select>
        </div>
    </div>

    <button id="pauseButton">Пауза</button>

    <div class="preview-title">Предварительный просмотр:</div>
